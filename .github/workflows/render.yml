name: render-clip

on:
  repository_dispatch:
    types: [render]

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Download composite image from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          IMAGE_KEY: ${{ github.event.client_payload.image_key }}
        run: |
          echo "Downloading $IMAGE_KEY"
          aws s3 cp "s3://$R2_BUCKET/$IMAGE_KEY" in.jpg --endpoint-url "$R2_ENDPOINT"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render 2s static clip
        run: |
          ffmpeg -y -loop 1 -t 2 -i in.jpg -i bgm.mp3 \
            -filter_complex "[0:v]scale=720:1280,format=yuv420p[v];[1:a]atrim=0:2[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart \
            -c:a aac -b:a 128k -shortest out.mp4

      - name: Upload MP4 to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OUT_KEY: ${{ github.event.client_payload.out_key }}
        run: |
          aws s3 cp out.mp4 "s3://$R2_BUCKET/$OUT_KEY" --endpoint-url "$R2_ENDPOINT"
          echo "Uploaded to s3://$R2_BUCKET/$OUT_KEY"
